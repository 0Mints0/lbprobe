name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-selfcheck:
    name: 编译 + 仿真自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译仿真后端（不需要 MPI）
        run: make

      - name: MPI 分支语法检查（用 tests/fake_mpi 的桩 mpi.h）
        run: |
          gcc -fsyntax-only -DLBPROBE_HAVE_MPI -Iinclude -Itests/fake_mpi \
              -std=c99 -D_POSIX_C_SOURCE=200809L src/lbprobe.c
          gcc -fsyntax-only -DLBPROBE_HAVE_MPI -Iinclude -Itests/fake_mpi \
              -std=c99 -D_POSIX_C_SOURCE=200809L examples/lb_minimal_mpi.c

      - name: 生成单文件版并自检
        # 注意两点：
        #  - 生成物 lbprobe_single.h 落在仓库根，而 single_check.c 里 include 的是它，
        #    所以必须给 -I.（编译器不会在当前工作目录里找引号包含的头文件）
        #  - 单文件版里只有探针本体，仿真后端的 lbsim_* 在 src/lbprobe_sim.c，要一起链接
        run: |
          python3 tools/make_single.py
          gcc -O2 -Wall -Wextra -I. -Iinclude -std=gnu99 \
              tests/single_check.c src/lbprobe_sim.c -o /tmp/single_check -lm
          /tmp/single_check

      - name: 跑 4 个仿真算例并生成报告
        run: make sim-all

      - name: 管线自检（拆分恒等式 / 日志完整性 / 进程数一致）
        run: python3 tools/check_reports.py runs

      - name: 保存样例报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: runs/*/report.md
          if-no-files-found: warn
